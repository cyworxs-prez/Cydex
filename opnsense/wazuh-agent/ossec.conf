<!--
  Wazuh agent config for OPNsense (FreeBSD) -> manager 10.10.140.11
  Purpose: ship Suricata EVE JSON so alerts decode as rule 86601 with full
  HTTP/TLS/DNS/flow metadata instead of the flat fast.log syslog line.

  syscheck/rootcheck are disabled on purpose: this VM has ~3 GB and is the
  only path to the internet. Keep the agent cheap.
-->
<ossec_config>

  <client>
    <server>
      <address>10.10.140.11</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.10.140.11</manager_address>
      <port>1515</port>
      <agent_name>opnsense</agent_name>
    </enrollment>
    <config-profile>freebsd</config-profile>
    <notify_time>30</notify_time>
    <time-reconnect>120</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Suricata IDS, the reason this agent exists. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Firewall + system logs OPNsense writes in plain syslog form. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/system/latest.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/audit/latest.log</location>
  </localfile>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>
