# Runs the release gate (tools/export-release.sh -> tools/check.sh) on every PR
# to main and every push to main. Same check you run locally before a release.
#
# One-time setup: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  CYDEX_PRIVATE_PATTERNS
#   Value: the contents of ~/.config/cydex/private-patterns.txt
# Without it the gate fails on purpose (a scan without private patterns proves little).
# PRs from forks don't get secrets, so they fail here - review those by hand.
name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Write private patterns from secret
        env:
          PATTERNS: ${{ secrets.CYDEX_PRIVATE_PATTERNS }}
        run: |
          if [ -z "$PATTERNS" ]; then
            echo "::error::Secret CYDEX_PRIVATE_PATTERNS is not set (or this is a fork PR). See the top of this workflow."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/cydex"
          printf '%s\n' "$PATTERNS" > "$RUNNER_TEMP/cydex/private-patterns.txt"
          echo "CYDEX_PRIVATE_PATTERNS=$RUNNER_TEMP/cydex/private-patterns.txt" >> "$GITHUB_ENV"

      # This repo's logs are public. On failure, print only the check summary lines,
      # never the matched content (it can contain your private patterns).
      # Re-run locally to see what matched.
      - name: Release gate
        run: |
          set -o pipefail
          if tools/export-release.sh "$RUNNER_TEMP/export" > "$RUNNER_TEMP/gate.log" 2>&1; then
            cat "$RUNNER_TEMP/gate.log"
          else
            grep -E '^(==|  (ok|skip|info|warn|FAIL) )|^(PASS|FAIL)' "$RUNNER_TEMP/gate.log" \
              | sed -E 's/private patterns found.*$/private patterns found (details hidden - run tools\/export-release.sh locally)/'
            echo "::error::Release gate failed. Run tools/export-release.sh locally for details."
            exit 1
          fi

      - name: Remove private patterns
        if: always()
        run: rm -rf "$RUNNER_TEMP/cydex"
