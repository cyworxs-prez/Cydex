# Lints every shell and Python script on PRs and pushes to main.
# Bugs only, not style: see ruff.toml. Shell: warnings and errors.
name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install linters (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet shellcheck-py==0.11.0.1 ruff==0.17.3
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: ruff
        run: ruff check --output-format github .
